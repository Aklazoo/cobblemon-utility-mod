name: build
on: [push, workflow_dispatch]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unzip the latest client source
        run: |
          ZIP=$(ls cobblemon_utility_mod_[0-9]*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No cobblemon_utility_mod_<number>.zip found"; ls -la; exit 1; fi
          echo "Using zip: $ZIP"
          rm -rf proj_client
          mkdir proj_client
          unzip -oq "$ZIP" -d proj_client || [ $? -eq 1 ]
          GRADLE_FILE=$(find proj_client -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "build.gradle not found in the zip"; find proj_client | head -50; exit 1; fi
          echo "PROJ=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJ"
          gradle build --no-daemon --stacktrace
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar-latest
          path: |
            ${{ env.PROJ }}/build/libs/*.jar
            !${{ env.PROJ }}/build/libs/*-sources.jar

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unzip the latest server source
        run: |
          ZIP=$(ls cobblemon_shiny_control_[0-9]*.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No cobblemon_shiny_control_<number>.zip found"; ls -la; exit 1; fi
          echo "Using zip: $ZIP"
          rm -rf proj_server
          mkdir proj_server
          unzip -oq "$ZIP" -d proj_server || [ $? -eq 1 ]
          GRADLE_FILE=$(find proj_server -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then echo "build.gradle not found in the zip"; find proj_server | head -50; exit 1; fi
          echo "PROJ=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJ"
          gradle build --no-daemon --stacktrace
          ls -la build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: shiny-control-jar
          path: |
            ${{ env.PROJ }}/build/libs/*.jar
            !${{ env.PROJ }}/build/libs/*-sources.jar
