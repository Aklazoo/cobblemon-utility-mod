name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o cobblemon_mods.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build -p cobblemon_shiny_control
      - run: gradle build -p cobblemon_utility_mod
      - uses: actions/upload-artifact@v4
        with:
          name: shiny-control-jar
          path: |
            cobblemon_shiny_control/build/libs/*.jar
            !cobblemon_shiny_control/build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar-latest
          path: |
            cobblemon_utility_mod/build/libs/*.jar
            !cobblemon_utility_mod/build/libs/*-sources.jar
