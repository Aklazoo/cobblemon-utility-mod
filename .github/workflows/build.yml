name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip latest source
        run: |
          ls -la
          Z=$(ls -1 cobblemon_utility_mod_[0-9]*.zip 2>/dev/null | sort -V | tail -n 1)
          echo "Using zip: $Z"
          if [ -z "$Z" ]; then echo "ERREUR: aucun fichier cobblemon_utility_mod_<numero>.zip dans le depot"; exit 1; fi
          rm -rf cobblemon_utility_mod
          unzip -o "$Z"
          grep mod_version cobblemon_utility_mod/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle build -p cobblemon_utility_mod
      - run: ls cobblemon_utility_mod/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar-latest
          path: cobblemon_utility_mod/build/libs/*.jar
